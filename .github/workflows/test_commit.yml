name: Test Commits

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Verify Code Formatting
        run: |
          echo "Checking code layout via nimpretty..."
          nimpretty --check src/*.nim

      - name: Install Dependencies
        run: |
          # If your testing suite requires third-party packages, declare them here.
          # Example: If iffy/nim-argparse or other libraries are explicitly needed:
          # nimble install -y argparse

      - name: Compile and Run Automated Tests
        run: |
          echo "Compiling all test files..."
          for test_file in tests/t_*.nim; do
            if [ -f "$test_file" ]; then
              echo "Executing: $test_file"
              nim c -r --colors:on "$test_file" || exit 1
            fi
          done
