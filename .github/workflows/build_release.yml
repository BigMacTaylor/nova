name: Build Release

env:
  MY_APP: "nova"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-nim:
    runs-on: ubuntu-22.04
    
    strategy:
      matrix:
        include:
          - target: glibc
            image: null
            suffix: glibc
          - target: musl
            image: alpine:latest
            suffix: musl

    container: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- ENVIRONMENT SETUP BRANCHES ---

      - name: Set up Nim and Tools (Ubuntu GLIBC)
        if: matrix.target == 'glibc'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Release CLI Dependencies (Ubuntu GLIBC)
        if: matrix.target == 'glibc'
        run: |
          sudo apt-get update && sudo apt-get install -y gh file tar curl

      # Install Nim, static musl OpenSSL, and verification tools via apk
      - name: Set up Nim and Dependencies (Alpine MUSL)
        if: matrix.target == 'musl'
        run: |
          apk update
          apk add --no-cache nim gcc musl-dev openssl-dev openssl-libs-static zlib-dev zlib-static github-cli git file libc-utils tar coreutils curl

      # --- CODE VERIFICATION & COMPILATION ---

      # Format check on host runner only
      - name: Verify code formatting
        if: matrix.target == 'glibc'
        run: |
          nimpretty --check src/*.nim

      # Compile regular dynamically-linked binary
      - name: Build Nim Release Binary (GLIBC)
        if: matrix.target == 'glibc'
        run: |
          mkdir -p dist-bins/ glibc-bin/
          nim c -d:release -d:ssl -d:openssl3 --passL:"-s" -o:glibc-bin/${{ env.MY_APP }} src/${{ env.MY_APP }}.nim
          tar -czf dist-bins/${{ env.MY_APP }}-linux-${{ matrix.suffix }}-amd64.tar.gz -C glibc-bin/ ${{ env.MY_APP }}

      # --- DEB & RPM PACKAGE GENERATION WITH NFPM ---

      - name: Generate Dynamic nFPM Config (GLIBC)
        if: matrix.target == 'glibc'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}" # Strips 'v' prefix if present
          
          cat <<EOF > nfpm.yaml
          name: "${{ env.MY_APP }}"
          arch: "amd64"
          platform: "linux"
          version: "${VERSION}"
          section: "utils"
          priority: "optional"
          maintainer: "Mac Taylor <noreply@github.com>"
          description: "Next Generation Package Manager."
          homepage: "https://github.com/${{ github.repository }}"
          license: "MIT"
          contents:
            - src: "glibc-bin/${{ env.MY_APP }}"
              dst: "/usr/bin/${{ env.MY_APP }}"
              file_info:
                mode: 0755
          deb:
            # Compression algorithm (gzip (default), zstd, xz or none).
            # Optionally compression level (gzip:-1 (default), gzip:1, gzip:9, zstd:1, zstd:19)
            compression: xz
          # Custom configuration applied only to the RPM packager.
          rpm:
            compression: xz
            buildhost: fedora

          EOF

      - name: Download and Install nFPM Binary (GLIBC)
        if: matrix.target == 'glibc'
        run: |
          NFPM_VERSION="2.49.0"
          curl -sSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          mkdir -p nfpm-cli
          tar -xzf nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz -C nfpm-cli/
          sudo mv nfpm-cli/nfpm /usr/local/bin/
          rm -rf nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz nfpm-cli/
          nfpm --version

      - name: Build DEB and RPM Packages via nFPM CLI
        if: matrix.target == 'glibc'
        run: |
          nfpm package --config nfpm.yaml --target dist-bins/ --packager deb
          nfpm package --config nfpm.yaml --target dist-bins/ --packager rpm

      # Compile statically-linked musl binary
      - name: Build Nim Release Binary (MUSL)
        if: matrix.target == 'musl'
        run: |
          mkdir -p dist-bins/ musl-bin/
          nim c -d:release -d:ssl \
            -d:openssl3 \
            --define:sslVersion="3.0.0" \
            --dynlibOverride:ssl \
            --dynlibOverride:crypto \
            --passL:"-static" \
            --passL:"-s" \
            --passL:"/usr/lib/libssl.a" \
            --passL:"/usr/lib/libcrypto.a" \
            --passL:"/usr/lib/libz.a" \
            --passL:"-lpthread" \
            -o:musl-bin/${{ env.MY_APP }} \
            src/${{ env.MY_APP }}.nim
          tar -czf dist-bins/${{ env.MY_APP }}-linux-${{ matrix.suffix }}-amd64.tar.gz -C musl-bin/ ${{ env.MY_APP }}

      # Verification check for musl build
      - name: Verify Binary is Static (MUSL)
        if: matrix.target == 'musl'
        run: |
          file musl-bin/${{ env.MY_APP }}
          ! ldd musl-bin/${{ env.MY_APP }} 2>&1 | grep -q "Not a valid dynamic program" || echo "Verified: Fully static!"

      # --- CHECKSUM GENERATION ---

      # Compute SHA-256 for all generated build targets in the matrix runner
      - name: Generate Checksums
        run: |
          cd dist-bins/
          for file in *.{tar.gz,deb,rpm}; do
            [ -f "$file" ] || continue
            sha256sum "$file" > "$file".sha256
          done

      # --- ASSET UPLOAD ---

      - name: Upload Archives, Packages, and Checksums to Release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist-bins/* --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
